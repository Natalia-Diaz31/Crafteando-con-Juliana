<!DOCTYPE html>
<!-- ARCHIVO: Pantalla de inicio de sesión | Buscar: login, index, HU-02 -->
<html lang="es">
<!-- Qué hace: Título, estilos y Bootstrap de la página | Buscar: head, estilos -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión sistema de planillas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <!-- Qué hace: Contenido principal del inicio de sesión | Buscar: login-page -->
    <main class="login-page">
        <div class="login-card">
            <div class="text-center mb-2">
                <img src="IMG/OIP.webp" alt="Logo" class="logo">
                <h1>Banco Hipotecario</h1>
                <p class="subtitle">Sistema de Gestión de Planillas</p>
            </div>

            <!-- Qué hace: Formulario de correo y contraseña | Buscar: form-login, usuario, password -->
            <form id="form-login" novalidate>
                <div class="mb-3">
                   <label for="usuario" class="form-label">Correo electrónico</label>
                    <input type="email"
                        class="form-control"
                        id="usuario"
                        placeholder="usuario@bancohipotecario.com.sv">
                    <div id="usuario-error"
                    class="error-message text-danger"
                    role="alert"></div>
                    
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="password-container">
                        <input type="password"
                            class="form-control"
                            id="password"
                            placeholder="Contraseña">
                    </div>

                    <div id="password-error"
                    class="error-message text-danger"
                    role="alert"></div>
                </div>

                <div class="security-message">
                    <i class="bi bi-lock"></i>
                    <span>Acceso restringido para personal autorizado del banco.</span>
                </div>

                <button type="submit" class="btn login-button w-100">
                    Iniciar sesión
                </button>

                <p id="mensaje-login"
                   class="text-danger mt-2"
                   role="alert"
                   aria-live="polite"></p>

                <p class="support-text">
                    ¿Olvidó sus credenciales? Contacte a Soporte TI (Ext. 404)
                </p>

            </form>

        </div>

        <!-- Qué hace: Pie de página | Buscar: footer, copyright -->
        <footer class="copyright">
            © 2026 Banco Hipotecario de El Salvador, S.A.
            Todos los derechos reservados.
        </footer>

    </main>
    <!-- Qué hace: Scripts de la página de inicio de sesión | Buscar: scripts, login.js -->
    <script src="js/config.js"></script>
    <script src="js/rol.js"></script>
    <script src="js/login-validacion.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
