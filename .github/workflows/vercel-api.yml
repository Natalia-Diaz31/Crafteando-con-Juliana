name: API - Preparar despliegue Vercel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar-api:
    name: Probar y construir API
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: api_

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Obtener codigo de GitHub
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api_/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis del servidor
        run: node --check server.js

      - name: Ejecutar pruebas existentes
        run: node --test --test-reporter=spec ../ci-tests/api.test.cjs

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Obtener configuracion de Vercel
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Comprobar construccion de la API
        run: vercel build --prod --token="$VERCEL_TOKEN"

   
      - name: Publicar API de prueba sin cambiar dominio
        id: despliegue
        run: |
          url=$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

     
      - name: Probar API protegida
        run: |
          vercel curl /health --deployment "${{ steps.despliegue.outputs.url }}" --fail-with-body

          
      - name: Verificar rol del usuario HU-09
        env:
          API_TEST_PASSWORD: ${{ secrets.API_TEST_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$API_TEST_PASSWORD" ]; then
            echo "Falta configurar API_TEST_PASSWORD"
            exit 1
          fi

          respuesta="$(
            node -e 'process.stdout.write(JSON.stringify({
              correo: "prueba.sinrol@planillas.com",
              contrasena: process.env.API_TEST_PASSWORD
            }))' |
            vercel curl /api/auth/login \
              --deployment "${{ steps.despliegue.outputs.url }}" \
              -X POST \
              -H "Content-Type: application/json" \
              --data-binary @- \
              --fail-with-body
          )"

          printf '%s' "$respuesta" | node -e '
            let texto = "";
            process.stdin.on("data", dato => texto += dato);
            process.stdin.on("end", () => {
              try {
                const datos = JSON.parse(texto);

                if (
                  datos.ok !== true ||
                  datos.usuario?.correo !== "prueba.sinrol@planillas.com" ||
                  datos.usuario?.rol !== "Sin permisos" ||
                  !datos.usuario?.id
                ) {
                  console.error("Error: login no devolvió los datos esperados");
                  process.exitCode = 1;
                } else {
                  console.log("HU-09: autenticación correcta");
                  console.log("Rol recibido: Sin permisos");
                }
              } catch {
                console.error("Error: respuesta de login inválida");
                process.exitCode = 1;
              }
            });
          '



