name: API - Preparar despliegue Vercel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar-api:
    name: Probar y construir API
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: api_

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Obtener codigo de GitHub
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api_/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis del servidor
        run: node --check server.js

      - name: Ejecutar pruebas existentes
        run: node --test --test-reporter=spec ../ci-tests/api.test.cjs

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Obtener configuracion de Vercel
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Comprobar construccion de la API
        run: vercel build --prod --token="$VERCEL_TOKEN"

   
      - name: Publicar API de prueba sin cambiar dominio
        id: despliegue
        run: |
          url=$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

     
      - name: Probar API protegida
        run: |
          vercel curl /health --deployment "${{ steps.despliegue.outputs.url }}" --fail-with-body

     
      - name: Diagnosticar login HU-09
        env:
          API_TEST_PASSWORD: ${{ secrets.API_TEST_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${API_TEST_PASSWORD:-}" ]; then
            echo "Falta API_TEST_PASSWORD"
            exit 1
          fi

          peticion="$RUNNER_TEMP/hu09-peticion.json"
          respuesta="$RUNNER_TEMP/hu09-respuesta.json"

          node -e 'const fs = require("fs"); fs.writeFileSync(process.argv[1], JSON.stringify({ correo: "prueba.sinrol@planillas.com", contrasena: process.env.API_TEST_PASSWORD }), { mode: 0o600 });' "$peticion"

          estado="$(vercel curl /api/auth/login --deployment "${{ steps.despliegue.outputs.url }}" -- --request POST --header "Content-Type: application/json" --data-binary "@$peticion" --silent --show-error --output "$respuesta" --write-out '%{http_code}')"

          echo "Estado HTTP: $estado"

          LOGIN_STATUS="$estado" RESPUESTA="$respuesta" node -e '
            const fs = require("fs");
            let datos;

            try {
              datos = JSON.parse(fs.readFileSync(process.env.RESPUESTA, "utf8"));
            } catch {
              console.error("La respuesta no es JSON. Revisar proteccion de Vercel.");
              process.exit(1);
            }

            if (
              process.env.LOGIN_STATUS === "200" &&
              datos.ok === true &&
              datos.usuario?.correo === "prueba.sinrol@planillas.com" &&
              datos.usuario?.rol === "Sin permisos"
            ) {
              console.log("HU-09: autenticacion correcta");
              console.log("Rol recibido: Sin permisos");
            } else {
              console.error(
                process.env.LOGIN_STATUS === "401"
                  ? "Acceso rechazado: revisar las credenciales de prueba."
                  : "La respuesta no contiene el rol esperado."
              );
              process.exit(1);
            }
          '
